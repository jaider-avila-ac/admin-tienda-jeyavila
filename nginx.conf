server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Panel privado: ningún buscador debe indexarlo (aplica a todas las respuestas).
    add_header X-Robots-Tag "noindex, nofollow, noarchive, nosnippet, noimageindex" always;

    # El backend (contenedor "api") vive en la MISMA red interna de Docker ("coolify"), así que
    # se le llama directo por su alias ahí (api:8080, sin TLS) en vez de por su dominio público —
    # ver tienda-jeyavila/nginx.conf para el detalle completo de por qué (Traefik no confía en
    # un X-Forwarded-Host puesto por este mismo nginx si la solicitud sale y vuelve a entrar por
    # el dominio público; por la red interna no hay ese segundo salto).
    resolver 127.0.0.11 valid=30s;

    location /api/ {
        set $api_backend "http://api:8080";
        proxy_pass $api_backend;
        proxy_set_header X-Forwarded-Host $host;
    }

    # WebSocket de notificaciones (SockJS/STOMP) — mismo motivo que /api/ de arriba.
    location /ws {
        set $ws_backend "http://api:8080";
        proxy_pass $ws_backend;
        proxy_set_header X-Forwarded-Host $host;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(js|css|png|jpg|svg|ico|woff2)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Robots-Tag "noindex, nofollow, noarchive, nosnippet, noimageindex" always;
    }
}
